<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beyond DX - On-Site Check-In</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0a0d2e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 { color: #38bdf8; margin-bottom: 8px; text-align: center; }
    p { color: #a1a5d2; margin-top: 0; margin-bottom: 24px; text-align: center; }
    #reader {
      width: 100%;
      max-width: 480px;
      background-color: #131538;
      border: 2px solid #282b68;
      border-radius: 12px;
      overflow: hidden;
    }
    #result-box {
      margin-top: 24px;
      padding: 20px;
      border-radius: 10px;
      background-color: #131538;
      border: 1px solid #38bdf8;
      max-width: 480px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      display: none;
    }
    .attendee-name { font-size: 1.4rem; font-weight: bold; color: #4ade80; margin-bottom: 4px; }
    .attendee-agency { font-size: 1rem; color: #cbd5e1; }
    .checkin-status { font-size: 0.85rem; color: #38bdf8; margin-top: 8px; }
  </style>
</head>
<body>

  <h1>Beyond DX Check-In Scanner</h1>
  <p>Scan attendee entry pass QR code</p>

  <div id="reader"></div>

  <div id="result-box">
    <div id="attendee-name" class="attendee-name"></div>
    <div id="attendee-agency" class="attendee-agency"></div>
    <div id="checkin-status" class="checkin-status">Logging to sheet...</div>
  </div>

  <script>
    // REPLACE WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
    const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_DEPLOYMENT_ID/exec";
    let isProcessing = false;

    function speakWelcome(name) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const message = new SpeechSynthesisUtterance("Welcome to Beyond DX, " + name + "!");
        message.rate = 0.95;
        message.lang = 'en-US';
        window.speechSynthesis.speak(message);
      }
    }

    function parseQRData(qrText) {
      let name = "Attendee";
      let agency = "";
      let email = "";

      const nameMatch = qrText.match(/Name:\s*([^|]+)/i);
      const agencyMatch = qrText.match(/Agency:\s*([^|]+)/i);
      const emailMatch = qrText.match(/Email:\s*([^|]+)/i);

      if (nameMatch && nameMatch[1]) name = nameMatch[1].trim();
      if (agencyMatch && agencyMatch[1]) agency = agencyMatch[1].trim();
      if (emailMatch && emailMatch[1]) email = emailMatch[1].trim();

      return { name, agency, email };
    }

    function recordCheckInInSheet(parsedData) {
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "checkIn",
          name: parsedData.name,
          agency: parsedData.agency,
          email: parsedData.email
        })
      })
      .then(() => {
        document.getElementById('checkin-status').innerText = "✓ Check-in time recorded in Google Sheet!";
      })
      .catch(() => {
        document.getElementById('checkin-status').innerText = "✓ Checked in locally";
      });
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const data = parseQRData(decodedText);

      document.getElementById('attendee-name').innerText = "Welcome, " + data.name + "!";
      document.getElementById('attendee-agency').innerText = data.agency ? "Agency: " + data.agency : "";
      document.getElementById('checkin-status').innerText = "Logging to sheet...";
      document.getElementById('result-box').style.display = 'block';

      // 1. Play natural voice welcome
      speakWelcome(data.name);

      // 2. Post check-in timestamp directly to Google Sheets Column F
      recordCheckInInSheet(data);

      setTimeout(() => {
        document.getElementById('result-box').style.display = 'none';
        isProcessing = false;
      }, 4500);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      { fps: 10, qrbox: { width: 250, height: 250 }, facingMode: "environment" },
      false
    );

    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>

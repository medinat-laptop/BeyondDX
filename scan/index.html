<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beyond DX - On-Site QR Scanner</title>
  <!-- Load HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0a0d2e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
      font-size: 1.8rem;
    }
    p.subtitle {
      color: #a1a5d2;
      margin-bottom: 24px;
      text-align: center;
      font-size: 1rem;
    }
    #reader {
      width: 100%;
      max-width: 480px;
      background-color: #131538;
      border: 2px solid #282b68;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    /* AUTOMATIC WELCOME POPUP OVERLAY */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(10, 13, 46, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .popup-card {
      background: linear-gradient(135deg, #131538 0%, #1a1c4b 100%);
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 36px 28px;
      width: 90%;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(56, 189, 248, 0.2);
      transform: scale(0.8);
      transition: transform 0.3s ease;
    }

    .popup-overlay.active .popup-card {
      transform: scale(1);
    }

    .icon-badge {
      width: 64px;
      height: 64px;
      background-color: rgba(74, 222, 128, 0.15);
      border: 2px solid #4ade80;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      color: #4ade80;
      font-size: 1.8rem;
    }

    .popup-title {
      color: #38bdf8;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .attendee-name {
      font-size: 1.8rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .attendee-agency {
      font-size: 1.05rem;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .status-text {
      font-size: 0.85rem;
      color: #4ade80;
      background-color: rgba(74, 222, 128, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 20px;
    }

    /* ACTION BUTTONS ON POPUP */
    .popup-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn-print {
      background-color: #38bdf8;
      color: #0a0d2e;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    .btn-print:hover {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-close {
      background-color: #282b68;
      color: #ffffff;
      border: 1px solid #38bdf8;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* HIDDEN RECEIPT DEFAULT DISPLAY */
    #printable-receipt {
      display: none;
    }

    /* FIXED GOOJPRT PRINT OVERRIDE */
    @media print {
      @page {
        size: 100mm 150mm;
        margin: 0;
      }

      body * {
        visibility: hidden !important;
      }

      #printable-receipt, 
      #printable-receipt * {
        visibility: visible !important;
      }

      #printable-receipt {
        display: block !important;
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 100mm !important;
        color: #000000 !important;
        background: #ffffff !important;
        font-family: 'Courier New', Courier, monospace !important;
        padding: 8mm !important;
        box-sizing: border-box !important;
      }
    }
  </style>
</head>
<body>

  <h1>Beyond DX Check-In Pass Scanner</h1>
  <p class="subtitle">Point camera at the attendee's email QR pass</p>

  <!-- Camera Container -->
  <div id="reader"></div>

  <!-- AUTOMATIC WELCOME POPUP MODAL -->
  <div id="welcome-popup" class="popup-overlay">
    <div class="popup-card">
      <div class="icon-badge">✓</div>
      <div class="popup-title">Welcome to Beyond DX</div>
      <div id="popup-name" class="attendee-name">Attendee Name</div>
      <div id="popup-agency" class="attendee-agency">Agency / Organization</div>
      <div id="popup-status" class="status-text">✓ Attendance Recorded</div>
      
      <!-- ACTION BUTTONS -->
      <div class="popup-actions">
        <button class="btn-print" onclick="triggerBadgePrint()">🖨️ Print Badge</button>
        <button class="btn-close" onclick="closeWelcomePopup()">Close Pass</button>
      </div>
    </div>
  </div>

  <!-- GOOJPRT THERMAL PRINTABLE RECEIPT TEMPLATE -->
  <div id="printable-receipt">
    <div style="text-align: center; font-size: 12px; line-height: 1.3;">
      <p style="font-weight: bold; font-size: 16px; margin-bottom: 2px;">BEYOND DX 2026</p>
      <p style="font-size: 11px; margin-bottom: 6px;">AI Transformation Forum</p>
      <p style="border-top: 1px dashed #000; margin: 6px 0;"></p>
      <p style="font-size: 10px; text-transform: uppercase; margin: 4px 0;">OFFICIAL ATTENDEE PASS</p>
      <p id="receipt-name" style="font-size: 18px; font-weight: bold; margin: 10px 0; word-wrap: break-word;"></p>
      <p id="receipt-agency" style="font-size: 12px; margin-bottom: 8px;"></p>
      <p style="border-top: 1px dashed #000; margin: 6px 0;"></p>
      <p id="receipt-time" style="font-size: 10px; margin: 4px 0;"></p>
      <p style="font-size: 9px; margin-top: 8px;">DAP - Center for Strategic Futures</p>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtfcAO7dOTzgxi-deXwLZ5CbijyCLUqJz14DOFLLu5W-h0IwfHG1AwU78E1fJVK_GU/exec";
    let isProcessing = false;
    let autoCloseTimer = null;
    let currentAttendee = { name: "", agency: "" };

    // Automatic Voice Welcome Function
    function speakWelcome(name) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Clear queued speech
        
        setTimeout(() => {
          const speechText = "Welcome to Beyond DX, " + name + "!";
          const utterance = new SpeechSynthesisUtterance(speechText);
          utterance.rate = 0.95; // Natural speaking pace
          utterance.pitch = 1.0;
          utterance.lang = 'en-US';
          window.speechSynthesis.speak(utterance);
        }, 300);
      }
    }

    // Parse Scanned QR String
    function parseQRData(qrText) {
      let name = "Attendee";
      let agency = "";
      let email = "";

      const nameMatch = qrText.match(/Name:\s*([^|]+)/i);
      const agencyMatch = qrText.match(/Agency:\s*([^|]+)/i);
      const emailMatch = qrText.match(/Email:\s*([^|]+)/i);

      if (nameMatch && nameMatch[1]) name = nameMatch[1].trim();
      if (agencyMatch && agencyMatch[1]) agency = agencyMatch[1].trim();
      if (emailMatch && emailMatch[1]) email = emailMatch[1].trim();

      return { name, agency, email };
    }

    // Log Scan to Attendance Google Sheet
    function recordCheckInInSheet(parsedData) {
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "checkIn",
          name: parsedData.name,
          agency: parsedData.agency,
          email: parsedData.email
        })
      });
    }

    // Print Badge Function with ZLabel Share Sheet & Standard Browser Print Support
    async function triggerBadgePrint() {
      const name = currentAttendee.name ? currentAttendee.name : "Attendee";
      const agency = currentAttendee.agency ? currentAttendee.agency : "N/A";
      const timeIn = "Time-In: " + new Date().toLocaleTimeString();

      // Populate printable HTML template
      document.getElementById('receipt-name').innerText = name;
      document.getElementById('receipt-agency').innerText = agency;
      document.getElementById('receipt-time').innerText = timeIn;

      // Check if running on iOS/iPadOS with Web Share API
      if (navigator.share && /iPad|iPhone|iPod/.test(navigator.userAgent)) {
        try {
          const badgeText = `BEYOND DX 2026\nAI Transformation Forum\n------------------------\nOFFICIAL ATTENDEE PASS\nName: ${name}\nAgency: ${agency}\n${timeIn}\nDAP - Center for Strategic Futures`;
          await navigator.share({
            title: 'Beyond DX Attendee Badge',
            text: badgeText
          });
          return;
        } catch (err) {
          console.log("Share sheet dismissed or unsupported, falling back to window.print()");
        }
      }

      // Standard browser print fallback (for Laptops/PCs or standard AirPrint)
      window.print();
    }

    // Manual or Automatic Close Popup Function
    function closeWelcomePopup() {
      if (autoCloseTimer) clearTimeout(autoCloseTimer);
      const popup = document.getElementById('welcome-popup');
      popup.classList.remove('active');
      isProcessing = false;
    }

    // Triggered when camera reads QR pass
    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const data = parseQRData(decodedText);
      currentAttendee = data; // Store for printing

      // 1. Populate Popup Details
      document.getElementById('popup-name').innerText = data.name;
      document.getElementById('popup-agency').innerText = data.agency ? data.agency : "";
      
      // 2. Show Animated Popup Overlay
      const popup = document.getElementById('welcome-popup');
      popup.classList.add('active');

      // 3. Trigger Voice Greeting
      speakWelcome(data.name);

      // 4. Log to Attendance Google Sheet
      recordCheckInInSheet(data);

      // 5. Automatically close popup after 6 seconds if not manually dismissed
      autoCloseTimer = setTimeout(() => {
        closeWelcomePopup();
      }, 6000);
    }

    // CAMERA INITIALIZATION WITH LAPTOP + TABLET FALLBACK SUPPORT
    Html5Qrcode.getCameras().then(devices => {
      if (devices && devices.length > 0) {
        const cameraId = devices.length > 1 ? devices[1].id : devices[0].id;
        
        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          cameraId,
          { 
            fps: 10, 
            qrbox: { width: 250, height: 250 } 
          },
          onScanSuccess
        );
      } else {
        alert("No camera detected on this device.");
      }
    }).catch(err => {
      console.error("Camera access error:", err);
      const fallbackScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
      fallbackScanner.render(onScanSuccess);
    });
  </script>
</body>
</html>

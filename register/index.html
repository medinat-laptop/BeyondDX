<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond DX — Coming Soon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1a3a; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }

  /* Blurred colour blobs */
  .bg { position: fixed; inset: 0; filter: blur(70px); transform: scale(1.2); }
  .bg i { position: absolute; border-radius: 50%; animation: float 18s ease-in-out infinite alternate; }
  .bg i:nth-child(1) { width: 50vmax; height: 50vmax; background: #2f4fd8; top: -10%; left: -10%; }
  .bg i:nth-child(2) { width: 40vmax; height: 40vmax; background: #7a3cff; bottom: -10%; right: -5%; animation-delay: -6s; }
  .bg i:nth-child(3) { width: 30vmax; height: 30vmax; background: #11c5d9; top: 40%; left: 45%; animation-delay: -12s; }
  @keyframes float { to { transform: translate(8vmax, -6vmax) scale(1.15); } }

  /* Hidden content, revealed around the cursor */
  .reveal {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.2rem; color: #fff; text-align: center;
    --x: 50%; --y: 50%; --r: 260px;
    -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), #000 0%, transparent 100%);
            mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), #000 0%, transparent 100%);
  }
  .reveal p { margin: 0; font-size: clamp(1rem, 2.4vw, 1.6rem); letter-spacing: .12em; text-transform: lowercase; }
  .reveal h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 6rem); font-weight: 900; letter-spacing: -.02em; text-transform: uppercase; line-height: 1; }
  .reveal span { font-size: 2rem; letter-spacing: .3em; }
</style>
</head>
<body>

<div class="bg"><i></i><i></i><i></i></div>

<main class="reveal" id="reveal">
  <p>stay tuned for what's</p>
  <h1>Beyond DX</h1>
  <span>...</span>
</main>

<script>
  const el = document.getElementById('reveal');
  let tx = innerWidth / 2, ty = innerHeight / 2, x = tx, y = ty;

  const move = e => {
    const p = e.touches ? e.touches[0] : e;
    tx = p.clientX; ty = p.clientY;
  };
  addEventListener('mousemove', move);
  addEventListener('touchmove', move, { passive: true });
  addEventListener('touchstart', move, { passive: true });

  (function loop() {               // smooth trailing follow
    x += (tx - x) * 0.12;
    y += (ty - y) * 0.12;
    el.style.setProperty('--x', x + 'px');
    el.style.setProperty('--y', y + 'px');
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
